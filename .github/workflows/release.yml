name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag. Select the same tag as the workflow ref.
        required: true
        type: string

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: $/.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || '' }}

  publish:
    needs: build
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: cleisson-labs/.github/.github/workflows/release.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      notes: |
        ## devimg ${{ github.ref_name }}

        Release assets include the `devimg` CLI and SHA-256 checksums.

        Supported archives:

        - `devimg-linux-x86_64.tar.gz`
        - `devimg-darwin-x86_64.tar.gz`
        - `devimg-darwin-aarch64.tar.gz`
        - `devimg-windows-x86_64.tar.gz`
      generate-notes: false
