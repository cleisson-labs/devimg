name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select release target checks
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Qualify every supported target on main and on PRs changing release inputs.
          release=true
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only -z HEAD^1 HEAD -- \
              '.github/workflows/ci.yml' '.github/workflows/release*.yml' \
              'Cargo.lock' 'Cargo.toml' 'crates/*/Cargo.toml' 'scripts/package-release.sh' > "$RUNNER_TEMP/release-paths"
            if [[ ! -s "$RUNNER_TEMP/release-paths" ]]; then release=false; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release-build:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/release-build.yml

  security:
    uses: cleisson-labs/.github/.github/workflows/security.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0

  docs:
    uses: cleisson-labs/.github/.github/workflows/docs.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0

  reporting:
    uses: cleisson-labs/.github/.github/workflows/python.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      working-directory: scripts
      tests-directory: .

  codeql:
    uses: cleisson-labs/.github/.github/workflows/codeql.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    permissions:
      contents: read
      security-events: write
    with:
      language: rust

  audit:
    uses: cleisson-labs/.github/.github/workflows/rust-audit.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0

  rust-security:
    name: Cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.22.1
          fallback: none
      - run: cargo audit

  workspace:
    uses: cleisson-labs/.github/.github/workflows/rust.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      msrv: '1.88.0'
      release-build: false
      binary: devimg

  smoke:
    name: Action and dogfood smoke tests
    needs: workspace
    runs-on: ubuntu-latest # Match the shared Rust workflow that built the smoke binary.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devimg-linux-debug
          path: target/debug
      - run: chmod +x target/debug/devimg

      - name: Smoke local action optimize
        id: devimg-optimize
        uses: $/action
        with:
          config: examples/portfolio/devimg.toml
          mode: optimize
          binary-path: target/debug/devimg
          report-path: examples/portfolio/devimg-report.md
          manifest-path: examples/portfolio/public/images/devimg-manifest.json

      - name: Generate smoke manifest export
        run: |
          target/debug/devimg manifest export \
            --manifest examples/portfolio/public/images/devimg-manifest.json \
            --format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers \
            --output "${RUNNER_TEMP}/devimg.generated.ts"

      - name: Smoke local action check
        uses: $/action
        with:
          config: examples/portfolio/devimg.toml
          mode: check
          binary-path: target/debug/devimg
          report-path: examples/portfolio/devimg-report.md
          manifest-path: examples/portfolio/public/images/devimg-manifest.json
          export-output: ${{ runner.temp }}/devimg.generated.ts
          export-format: typescript
          export-typescript-helpers: "true"
          strip-prefix: public
          url-prefix: /
          review-output: examples/portfolio/.devimg/review.html

      - name: Smoke action binary path output
        env:
          DEVIMG_BIN: ${{ steps.devimg-optimize.outputs.binary-path }}
        run: |
          "$DEVIMG_BIN" ai consent \
            --config examples/portfolio/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/portfolio-openai-consent.json"
          "$DEVIMG_BIN" review \
            --manifest examples/portfolio/public/images/devimg-manifest.json \
            --ai \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-output "${RUNNER_TEMP}/portfolio-openai-ai-review.json"
          "$DEVIMG_BIN" alt \
            --config examples/portfolio/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/portfolio-openai-alt.json"
          "$DEVIMG_BIN" draft \
            --config examples/portfolio/devimg.toml \
            --draft-type project-page-copy \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-review-json "${RUNNER_TEMP}/portfolio-openai-ai-review.json" \
            --review-html examples/portfolio/.devimg/review.html \
            --output "${RUNNER_TEMP}/portfolio-project-page-copy.md"
          test -s "${RUNNER_TEMP}/portfolio-openai-consent.json"
          test -s "${RUNNER_TEMP}/portfolio-openai-ai-review.json"
          test -s "${RUNNER_TEMP}/portfolio-openai-alt.json"
          test -s "${RUNNER_TEMP}/portfolio-project-page-copy.md"

      - name: Verify action smoke artifacts
        run: |
          test -s examples/portfolio/devimg-report.md
          test -s examples/portfolio/public/images/devimg-manifest.json
          test -s "${RUNNER_TEMP}/devimg.generated.ts"
          test -s examples/portfolio/.devimg/review.html

      - name: Smoke dogfood example
        run: |
          target/debug/devimg optimize --config examples/dogfood/devimg.toml --dry-run
          target/debug/devimg optimize --config examples/dogfood/devimg.toml
          target/debug/devimg check --config examples/dogfood/devimg.toml
          target/debug/devimg suggest --metadata-only --check --fail-on-severity warning --config examples/dogfood/devimg.toml
          target/debug/devimg ai consent \
            --config examples/dogfood/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/dogfood-openai-consent.json"
          target/debug/devimg review \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --ai \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-output "${RUNNER_TEMP}/dogfood-openai-ai-review.json" \
            --markdown "${RUNNER_TEMP}/dogfood-openai-ai-review.md"
          target/debug/devimg alt \
            --config examples/dogfood/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/dogfood-openai-alt.json" \
            --markdown "${RUNNER_TEMP}/dogfood-openai-alt.md"
          target/debug/devimg draft \
            --config examples/dogfood/devimg.toml \
            --draft-type project-page-copy \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-review-json "${RUNNER_TEMP}/dogfood-openai-ai-review.json" \
            --review-html examples/dogfood/.devimg/review.html \
            --output "${RUNNER_TEMP}/dogfood-project-page-copy.md"
          target/debug/devimg manifest export \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers \
            --output "${RUNNER_TEMP}/dogfood.generated.ts"
          target/debug/devimg manifest export \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers \
            --output "${RUNNER_TEMP}/dogfood.generated.ts" \
            --check
          test -s "${RUNNER_TEMP}/dogfood-project-page-copy.md"
          target/debug/devimg doctor \
            --config examples/dogfood/devimg.toml \
            --export-output "${RUNNER_TEMP}/dogfood.generated.ts" \
            --export-format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers
          target/debug/devimg review \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --output examples/dogfood/.devimg/review.html
          test -s examples/dogfood/public/images/devimg-manifest.json
          test -s "${RUNNER_TEMP}/dogfood.generated.ts"
          test -s "${RUNNER_TEMP}/dogfood-openai-consent.json"
          test -s "${RUNNER_TEMP}/dogfood-openai-ai-review.json"
          test -s "${RUNNER_TEMP}/dogfood-openai-ai-review.md"
          test -s "${RUNNER_TEMP}/dogfood-openai-alt.json"
          test -s "${RUNNER_TEMP}/dogfood-openai-alt.md"
          test -s examples/dogfood/.devimg/review.html

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust coverage tools
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2
          fallback: none
      - name: Enforce split coverage gates and generate reports
        run: scripts/coverage.sh --reports

      - name: Write coverage summary
        run: |
          python3 scripts/coverage_summary.py \
            --report devimg-core=target/llvm-cov/json/devimg-core.json \
            --report devimg-cli=target/llvm-cov/json/devimg-cli.json \
            --artifact devimg-core=coverage-devimg-core-html \
            --artifact devimg-cli=coverage-devimg-cli-html \
            --output "$GITHUB_STEP_SUMMARY"

      - name: Upload core coverage HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-devimg-core-html
          path: target/llvm-cov/html/devimg-core/html
          if-no-files-found: error

      - name: Upload CLI coverage HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-devimg-cli-html
          path: target/llvm-cov/html/devimg-cli/html
          if-no-files-found: error

      - name: Upload coverage JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-json
          path: target/llvm-cov/json
          if-no-files-found: error

  ci-ok:
    if: always()
    needs: [changes, release-build, security, docs, reporting, codeql, audit, rust-security, workspace, smoke, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.outputs.release as $release |
            ($release == "true" or $release == "false") and
            all(to_entries[];
              if .key == "release-build" and $release == "false"
              then .value.result == "skipped"
              else .value.result == "success" end)
          ' <<< "$RESULTS"
