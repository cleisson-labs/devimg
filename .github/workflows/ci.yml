name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh release download "v${GITLEAKS_VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --dir "$tmp"
          (
            cd "$tmp"
            grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
            tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          )
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          install -m 0755 "$tmp/gitleaks" "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan secrets
        run: gitleaks detect --redact --config .gitleaks.toml --source . --platform github

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2

  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install zizmor --locked --version 1.25.2

      - name: Run zizmor
        run: zizmor --offline .

  rust-security:
    name: Rust Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Run cargo audit
        run: cargo audit

      - name: Install cargo-deny
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-deny --locked --version 0.19.6

      - name: Run cargo deny
        run: CARGO="$(rustup which --toolchain 1.88.0 cargo)" cargo-deny check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install Rust MSRV
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check MSRV
        run: cargo +1.88.0 check --workspace

      - name: Run clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +stable test --all

      - name: Build devimg
        run: cargo +stable build -p devimg

      - name: Smoke local action optimize
        id: devimg-optimize
        uses: ./action
        with:
          config: examples/portfolio/devimg.toml
          mode: optimize
          binary-path: target/debug/devimg
          report-path: examples/portfolio/devimg-report.md
          manifest-path: examples/portfolio/public/images/devimg-manifest.json

      - name: Generate smoke manifest export
        run: |
          target/debug/devimg manifest export \
            --manifest examples/portfolio/public/images/devimg-manifest.json \
            --format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers \
            --output "${RUNNER_TEMP}/devimg.generated.ts"

      - name: Smoke local action check
        uses: ./action
        with:
          config: examples/portfolio/devimg.toml
          mode: check
          binary-path: target/debug/devimg
          report-path: examples/portfolio/devimg-report.md
          manifest-path: examples/portfolio/public/images/devimg-manifest.json
          export-output: ${{ runner.temp }}/devimg.generated.ts
          export-format: typescript
          export-typescript-helpers: "true"
          strip-prefix: public
          url-prefix: /
          review-output: examples/portfolio/.devimg/review.html

      - name: Smoke action binary path output
        env:
          DEVIMG_BIN: ${{ steps.devimg-optimize.outputs.binary-path }}
        run: |
          "$DEVIMG_BIN" ai consent \
            --config examples/portfolio/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/portfolio-openai-consent.json"
          "$DEVIMG_BIN" review \
            --manifest examples/portfolio/public/images/devimg-manifest.json \
            --ai \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-output "${RUNNER_TEMP}/portfolio-openai-ai-review.json"
          "$DEVIMG_BIN" alt \
            --config examples/portfolio/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/portfolio-openai-alt.json"
          "$DEVIMG_BIN" draft \
            --config examples/portfolio/devimg.toml \
            --draft-type project-page-copy \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-review-json "${RUNNER_TEMP}/portfolio-openai-ai-review.json" \
            --review-html examples/portfolio/.devimg/review.html \
            --output "${RUNNER_TEMP}/portfolio-project-page-copy.md"
          test -s "${RUNNER_TEMP}/portfolio-openai-consent.json"
          test -s "${RUNNER_TEMP}/portfolio-openai-ai-review.json"
          test -s "${RUNNER_TEMP}/portfolio-openai-alt.json"
          test -s "${RUNNER_TEMP}/portfolio-project-page-copy.md"

      - name: Verify action smoke artifacts
        run: |
          test -s examples/portfolio/devimg-report.md
          test -s examples/portfolio/public/images/devimg-manifest.json
          test -s "${RUNNER_TEMP}/devimg.generated.ts"
          test -s examples/portfolio/.devimg/review.html

      - name: Smoke dogfood example
        run: |
          target/debug/devimg optimize --config examples/dogfood/devimg.toml --dry-run
          target/debug/devimg optimize --config examples/dogfood/devimg.toml
          target/debug/devimg check --config examples/dogfood/devimg.toml
          target/debug/devimg suggest --metadata-only --check --fail-on-severity warning --config examples/dogfood/devimg.toml
          target/debug/devimg ai consent \
            --config examples/dogfood/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/dogfood-openai-consent.json"
          target/debug/devimg review \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --ai \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-output "${RUNNER_TEMP}/dogfood-openai-ai-review.json" \
            --markdown "${RUNNER_TEMP}/dogfood-openai-ai-review.md"
          target/debug/devimg alt \
            --config examples/dogfood/devimg.toml \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --output "${RUNNER_TEMP}/dogfood-openai-alt.json" \
            --markdown "${RUNNER_TEMP}/dogfood-openai-alt.md"
          target/debug/devimg draft \
            --config examples/dogfood/devimg.toml \
            --draft-type project-page-copy \
            --ai-provider openai \
            --model openai-dry-run-model \
            --dry-run \
            --ai-review-json "${RUNNER_TEMP}/dogfood-openai-ai-review.json" \
            --review-html examples/dogfood/.devimg/review.html \
            --output "${RUNNER_TEMP}/dogfood-project-page-copy.md"
          target/debug/devimg manifest export \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers \
            --output "${RUNNER_TEMP}/dogfood.generated.ts"
          target/debug/devimg manifest export \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers \
            --output "${RUNNER_TEMP}/dogfood.generated.ts" \
            --check
          test -s "${RUNNER_TEMP}/dogfood-project-page-copy.md"
          target/debug/devimg doctor \
            --config examples/dogfood/devimg.toml \
            --export-output "${RUNNER_TEMP}/dogfood.generated.ts" \
            --export-format typescript \
            --strip-prefix public \
            --url-prefix / \
            --typescript-helpers
          target/debug/devimg review \
            --manifest examples/dogfood/public/images/devimg-manifest.json \
            --output examples/dogfood/.devimg/review.html
          test -s examples/dogfood/public/images/devimg-manifest.json
          test -s "${RUNNER_TEMP}/dogfood.generated.ts"
          test -s "${RUNNER_TEMP}/dogfood-openai-consent.json"
          test -s "${RUNNER_TEMP}/dogfood-openai-ai-review.json"
          test -s "${RUNNER_TEMP}/dogfood-openai-ai-review.md"
          test -s "${RUNNER_TEMP}/dogfood-openai-alt.json"
          test -s "${RUNNER_TEMP}/dogfood-openai-alt.md"
          test -s examples/dogfood/.devimg/review.html

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      - name: Run coverage
        run: scripts/coverage.sh

      - name: Generate coverage reports
        run: |
          set -euo pipefail
          test_ignore_regex='(.*/[^/]+_tests\.rs$|.*/tests/.*\.rs$)'
          cli_ignore_regex="(.*/crates/devimg-cli/src/openai_transport\\.rs$|$test_ignore_regex)"
          cli_report_ignore_regex="(.*/crates/devimg-core/.*|$cli_ignore_regex)"
          mkdir -p target/llvm-cov/json
          cargo llvm-cov clean --workspace

          cargo llvm-cov \
            -p devimg-core \
            --all-features \
            --lib \
            --ignore-filename-regex "$test_ignore_regex" \
            --fail-under-lines 100 \
            --fail-under-functions 100 \
            --fail-uncovered-lines 0 \
            --fail-uncovered-functions 0 \
            --json \
            --summary-only \
            --output-path target/llvm-cov/json/devimg-core.json
          cargo llvm-cov report \
            -p devimg-core \
            --ignore-filename-regex "$test_ignore_regex" \
            --html \
            --output-dir target/llvm-cov/html/devimg-core

          cargo llvm-cov \
            -p devimg \
            --all-features \
            --bin devimg \
            --no-clean \
            --exclude-from-report devimg-core \
            --ignore-filename-regex "$cli_ignore_regex" \
            --fail-under-lines 100 \
            --fail-under-functions 100 \
            --fail-uncovered-lines 0 \
            --fail-uncovered-functions 0 \
            --json \
            --summary-only \
            --output-path target/llvm-cov/json/devimg-cli.json
          cargo llvm-cov report \
            -p devimg \
            --ignore-filename-regex "$cli_report_ignore_regex" \
            --html \
            --output-dir target/llvm-cov/html/devimg-cli

      - name: Write coverage summary
        run: |
          python3 scripts/coverage_summary.py \
            --report devimg-core=target/llvm-cov/json/devimg-core.json \
            --report devimg-cli=target/llvm-cov/json/devimg-cli.json \
            --artifact devimg-core=coverage-devimg-core-html \
            --artifact devimg-cli=coverage-devimg-cli-html \
            --output "$GITHUB_STEP_SUMMARY"

      - name: Upload core coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-devimg-core-html
          path: target/llvm-cov/html/devimg-core/html
          if-no-files-found: error

      - name: Upload CLI coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-devimg-cli-html
          path: target/llvm-cov/html/devimg-cli/html
          if-no-files-found: error

      - name: Upload coverage JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-json
          path: target/llvm-cov/json
          if-no-files-found: error
