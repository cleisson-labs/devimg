name: Scheduled checks

on:
  schedule:
    - cron: '24 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    uses: cleisson-labs/.github/.github/workflows/codeql.yml@60b15e5b04ddffadb717dc4903287ac55637d5cc # v1.0.1
    permissions:
      contents: read
      security-events: write
    with:
      language: rust
      legacy-category: .github/workflows/codeql.yml:analyze

  audit:
    uses: cleisson-labs/.github/.github/workflows/rust-audit.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0

  external-links:
    uses: cleisson-labs/.github/.github/workflows/docs.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      external: true
